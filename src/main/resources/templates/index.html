<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Student Information System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: Arial, sans-serif;
      }
      .header {
        background-color: #4a6545;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .sub-header {
        font-size: 1.5rem;
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 20px;
        color: #2c3e50;
      }
      .btn-custom {
        background-color: #4a6545;
        color: white;
        border: none;
        margin-right: 10px;
      }
      .btn-custom:hover {
        background-color: #3b5135;
      }
      .table thead {
        background-color: #2c3e50;
        color: white;
      }
      .table td,
      .table th {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Student Information System</h2>
    </div>

    <div class="sub-header">Student Information</div>

    <div class="container mb-3">
      <a href="/student/new" class="btn btn-custom btn-sm">+ Student</a>
      <a href="/score/new" class="btn btn-custom btn-sm">+ Score</a>
    </div>

    <div class="container">
      <table class="table table-bordered text-center">
        <thead>
          <tr>
            <th>Id</th>
            <th>Student Id</th>
            <th>Student Name</th>
            <th>Subject Name</th>
            <th>Score 1</th>
            <th>Score 2</th>
            <th>Credit</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${scores}">
            <td th:text="${s.studentScoreId}"></td>
            <td
              th:text="${s.student != null ? s.student.studentCode : 'N/A'}"
            ></td>
            <td
              th:text="${s.student != null ? s.student.fullName : 'N/A'}"
            ></td>
            <td
              th:text="${s.subject != null ? s.subject.subjectCode : 'N/A'}"
            ></td>
            <td th:text="${s.score1}"></td>
            <td th:text="${s.score2}"></td>
            <td th:text="${s.subject != null ? s.subject.credit : 'N/A'}"></td>
            <td>
              <span th:with="finalScore=${0.3 * s.score1 + 0.7 * s.score2}">
                <span th:if="${finalScore >= 8.0}">A</span>
                <span th:if="${finalScore >= 6.0 and finalScore < 8.0}">B</span>
                <span th:if="${finalScore >= 4.0 and finalScore < 6.0}">D</span>
                <span th:if="${finalScore < 4.0}">F</span>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
