<form th:action="@{/score/save}" method="post" th:object="${score}">
  <!-- Student -->
  <div class="mb-3">
    <label class="form-label">Student</label>
    <select class="form-select" th:field="*{student}">
      <option value="" disabled selected>-- Select Student --</option>
      <option
        th:each="s : ${students}"
        th:value="${s}"
        th:text="${s.studentCode + ' - ' + s.fullName}"
      ></option>
    </select>
  </div>

  <!-- Subject -->
  <div class="mb-3">
    <label class="form-label">Subject</label>
    <select class="form-select" th:field="*{subject}">
      <option value="" disabled selected>-- Select Subject --</option>
      <option
        th:each="sub : ${subjects}"
        th:value="${sub}"
        th:text="${sub.subjectCode + ' - ' + sub.subjectName}"
      ></option>
    </select>
  </div>

  <!-- Score fields -->
  <div class="mb-3">
    <label class="form-label">Score 1</label>
    <input
      type="number"
      step="0.1"
      class="form-control"
      th:field="*{score1}"
      required
    />
  </div>
  <div class="mb-3">
    <label class="form-label">Score 2</label>
    <input
      type="number"
      step="0.1"
      class="form-control"
      th:field="*{score2}"
      required
    />
  </div>

  <button type="submit" class="btn btn-success">Save</button>
  <a href="/" class="btn btn-secondary">Cancel</a>
</form>
