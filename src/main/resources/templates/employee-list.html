<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <!-- FORM -->
    <div class="card">
        <div class="card-header">
            <h4>User</h4>
        </div>
        <div class="card-body">
            <!-- Success message -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- Error message -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input th:field="*{name}" type="text" class="form-control" id="name" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input th:field="*{age}" type="number" class="form-control" id="age" placeholder="Enter your age" required>
                </div>
                <div class="mb-3">
                    <label for="salary" class="form-label">Salary</label>
                    <input th:field="*{salary}" type="number" class="form-control" id="salary" placeholder="Enter your salary" required>
                </div>

                <button type="submit" class="btn btn-primary" th:text="${employee.id == null} ? 'Add' : 'Update'"></button>
                <a th:href="@{/employees}" class="btn btn-warning">Reset Form</a>
            </form>
        </div>
    </div>

    <!-- LIST -->
    <div class="card mt-4">
        <div class="card-header">
            <h4>List of Users</h4>
        </div>
        <div class="card-body">
            <table class="table table-bordered text-center">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.age}"></td>
                    <td th:text="${emp.salary}"></td>
                    <td>
                        <a th:href="@{'/employees/edit/' + ${emp.id}}" class="btn btn-success btn-sm">Edit</a>
                        <a th:href="@{'/employees/delete/' + ${emp.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Remove</a>
                    </td>
                </tr>
                <tr th:if="${employees.size() == 0}">
                    <td colspan="5">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
