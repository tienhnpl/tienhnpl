<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Tech Style</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0f172a;
        font-family: "Roboto", sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="flex items-center justify-center h-screen">
      <div class="w-full max-w-lg p-12 bg-gray-800 rounded-3xl shadow-2xl">
        <h2 class="text-4xl font-extrabold text-center text-white mb-12">
          Login to Your Account
        </h2>
        <form class="space-y-6">
          <div class="mb-4">
            <input
              type="email"
              placeholder="Email Address"
              class="w-full p-4 text-gray-900 rounded-xl border-2 border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>
          <div class="mb-4">
            <input
              type="password"
              placeholder="Password"
              class="w-full p-4 text-gray-900 rounded-xl border-2 border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>
          <div class="mb-4 flex justify-between items-center">
            <label class="text-gray-400">
              <input type="checkbox" class="mr-2" /> Remember me
            </label>
            <a href="#" class="text-blue-500">Forgot password?</a>
          </div>
          <button
            type="submit"
            class="w-full py-4 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all duration-300"
          >
            Login
          </button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-gray-400">Or login with</p>
          <div class="flex justify-center mt-4 space-x-6">
            <!-- Facebook Login Button -->
            <button
              id="facebook-login"
              class="w-12 h-12 flex items-center justify-center bg-blue-600 rounded-full hover:bg-blue-700 transition-all duration-200"
            >
              <i class="fab fa-facebook-f text-white text-lg"></i>
            </button>
            <!-- Google Login Button -->
            <button
              id="google-login"
              class="w-12 h-12 flex items-center justify-center bg-red-600 rounded-full hover:bg-red-700 transition-all duration-200"
            >
              <i class="fab fa-google text-white text-lg"></i>
            </button>
            <!-- GitHub Login Button -->
            <button
              id="github-login"
              class="w-12 h-12 flex items-center justify-center bg-gray-900 rounded-full hover:bg-gray-800 transition-all duration-200"
            >
              <i class="fab fa-github text-white text-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script
      src="https://connect.facebook.net/en_US/sdk.js"
      async
      defer
    ></script>
    <script src="App.js"></script>
  </body>
</html>
